# VirtualHost Apache para a Orkneytech.
# O install.sh substitui __DOMAIN__ e __TARGET__. Requer: mod_headers, mod_rewrite, PHP-FPM (proxy_fcgi) ou mod_php.
<VirtualHost *:80>
    ServerName __DOMAIN__
    ServerAlias www.__DOMAIN__
    DocumentRoot __TARGET__/public

    <Directory __TARGET__/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Variáveis lidas por app/config.php
    SetEnv ORKNEYTECH_DB __TARGET__/data/contatos.sqlite
    # SetEnv ORKNEYTECH_IP_SALT troque-por-um-valor-aleatorio
    # SetEnv ORKNEYTECH_NOTIFY_EMAIL contato@seudominio.com.br

    ErrorLog ${APACHE_LOG_DIR}/orkneytech-error.log
    CustomLog ${APACHE_LOG_DIR}/orkneytech-access.log combined
</VirtualHost>
# Para HTTPS: sudo certbot --apache -d __DOMAIN__ -d www.__DOMAIN__
