# Server block Nginx + PHP-FPM para a Orkneytech.
# O install.sh substitui __DOMAIN__, __TARGET__ e __PHP_FPM_SOCK__.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __TARGET__/public;
    index index.html;
    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # 'unsafe-inline' em script-src: scripts de hidratação do Next em export estático.
    # vlibras.gov.br: widget de Libras.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://vlibras.gov.br https://*.vlibras.gov.br; style-src 'self' 'unsafe-inline' https://vlibras.gov.br https://*.vlibras.gov.br; img-src 'self' data: blob: https://vlibras.gov.br https://*.vlibras.gov.br; font-src 'self' data: https://vlibras.gov.br https://*.vlibras.gov.br; connect-src 'self' https://vlibras.gov.br https://*.vlibras.gov.br; media-src 'self' blob: https://*.vlibras.gov.br; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # depois do HTTPS

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /contato.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/contato.php;
        fastcgi_param ORKNEYTECH_DB __TARGET__/data/contatos.sqlite;
        # fastcgi_param ORKNEYTECH_IP_SALT troque-por-um-valor-aleatorio;
        # fastcgi_param ORKNEYTECH_NOTIFY_EMAIL contato@seudominio.com.br;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        client_max_body_size 64k;
    }

    # Nenhum outro PHP e nenhum arquivo oculto é servido
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
# Para HTTPS: sudo certbot --nginx -d __DOMAIN__ -d www.__DOMAIN__
